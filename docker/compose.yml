services:
  mariadb:
    image: mariadb:12.2
    restart: always
    container_name: mariadb
    environment:
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    ports:
      - ${MARIADB_PORT}:3306
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - pisense-network
  
  pisense:
    image: pisense:latest
    container_name: pisense
    restart: always
    ports:
      - ${PISENSE_BACKEND_PORT}:8000
    networks:
      - pisense-network

networks:
  pisense-network:
