# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Running NOX Tests

on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  nox-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install C dependencies
      run: sudo apt-get update && sudo apt-get install -y libmariadb3 libmariadb-dev

    - name: Set up Python
      run: uv python install

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Run tests
      # Runs nox tests with dependency group `tests`
      run: uv run --group tests nox
  
  build-docker:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker buildx build -f docker/Dockerfile . -t pisense:latest

    - name: Run tests in the built image
      run: docker run pisense:latest

    - name: Its working
      run: docker ps