name: Deploy Main Branch on Push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: PiSense-Backend-Runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync files to production directory
        run: |
          rsync -av --delete \
          --exclude ".git" \
          --exclude ".env" \
          $GITHUB_WORKSPACE/ /home/pisense/backend/PiSense_Backend/
          
      - name: Install dependencies with uv
        working-directory: /home/pisense/backend/PiSense_Backend
        run: |
          /home/pisense/.local/bin/uv sync

      - name: Restart backend service
        run: |
          sudo systemctl restart pisense-backend
