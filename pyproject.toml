[project]
name = "pisense-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.3",
    "logging>=0.4.9.6",
    "mariadb>=1.1.14",
    "nox>=2025.11.12",
    "python-dotenv>=1.2.1",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.1",
    "requests-cache>=1.3.0",
    "retry-requests>=2.0.0",
]

[dependency-groups]
tests = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff]
include = ["test/*", "pisense/*"]

