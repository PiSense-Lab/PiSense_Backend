[project]
name = "pisense-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.3",
    "logging>=0.4.9.6",
    "nox>=2025.11.12",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.1",
    "requests-cache>=1.3.0",
    "retry-requests>=2.0.0",
    "mariadb>=1.1.14",
    "sqlalchemy>=2.0.46",
    "mysqlclient>=2.2.8",
    "pytest-order>=1.3.0",
    "cryptography>=46.0.6",
    "bcrypt>=5.0.0",
    "passlib>=1.7.4",
    "python-jose>=3.5.0",
]

[dependency-groups]
tests = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff]
include = ["test/*", "pisense/*", "e2e/*"]

[tool.setuptools.packages.find]
include = ["pisense*"]
